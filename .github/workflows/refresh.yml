# Nightly: fetch new videos, classify them, rebuild the site and deploy it to GitHub Pages.
# The DuckDB file lives as an asset on the "db" release, not in git, so history doesn't grow by ~18 MB a night.
name: Nightly refresh

on:
  schedule:
    - cron: "17 6 * * *"  # 06:17 UTC daily
  workflow_dispatch:

permissions: {}  # nothing by default; each job asks for only what it needs

concurrency:
  group: refresh  # two runs writing the same database would lose one run's work
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # download and upload the database release asset
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # don't leave the token in .git/config for later steps
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

      # Fails if the release asset is missing: rebuilding from scratch would burn quota and LLM spend.
      - name: Download database
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download db --pattern datatube.duckdb --dir data

      - name: Run pipeline
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATATUBE_MODEL: ${{ vars.DATATUBE_MODEL }}  # optional repo variable; empty means the default model
        run: python -m datatube all --limit 1000 --refresh

      # Saved even when a step failed (e.g. quota ran out): every step commits as it goes,
      # so the partial work is valid and the next run resumes from it.
      - name: Save database
        if: always() && steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload db data/datatube.duckdb --clobber

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # A separate job, as GitHub's Pages docs do: deploying in the same job as the upload
  # intermittently found "0 artifacts" (Nov 22-24) because the upload wasn't listed yet.
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deploy
        uses: actions/deploy-pages@v5
