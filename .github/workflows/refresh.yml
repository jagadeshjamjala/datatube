# Nightly: fetch new videos, classify them, rebuild the site and deploy it to GitHub Pages.
# The DuckDB file lives as an asset on the "db" release, not in git, so history doesn't grow by ~18 MB a night.
name: Nightly refresh

on:
  schedule:
    - cron: "17 6 * * *"  # 06:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write  # upload the database to the release
  pages: write
  id-token: write

concurrency:
  group: refresh  # two runs writing the same database would lose one run's work
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

      # Fails if the release asset is missing: rebuilding from scratch would burn quota and LLM spend.
      - name: Download database
        id: download
        run: gh release download db --pattern datatube.duckdb --dir data

      - name: Run pipeline
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATATUBE_MODEL: ${{ vars.DATATUBE_MODEL }}  # optional repo variable; empty means the default model
        run: python -m datatube all --limit 1000 --refresh

      # Saved even when a step failed (e.g. quota ran out): every step commits as it goes,
      # so the partial work is valid and the next run resumes from it.
      - name: Save database
        if: always() && steps.download.outcome == 'success'
        run: gh release upload db data/datatube.duckdb --clobber

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
